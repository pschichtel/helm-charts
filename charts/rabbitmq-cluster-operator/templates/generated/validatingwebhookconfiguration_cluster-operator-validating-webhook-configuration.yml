---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  annotations:
    cert-manager.io/inject-ca-from: '{{ .Release.Namespace }}/{{ include "rabbitmq-cluster-operator.fullname" $ }}-serving-cert'
  name: '{{ include "rabbitmq-cluster-operator.fullname" $ }}-validating-webhook-configuration'
  labels:
    app.kubernetes.io/name: '{{ include "rabbitmq-cluster-operator.name" $ }}'
    app.kubernetes.io/instance: '{{ .Release.Name }}'
webhooks:
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: '{{ include "rabbitmq-cluster-operator.fullname" $ }}-webhook-service'
        namespace: '{{ .Release.Namespace }}'
        path: /validate-rabbitmq-com-v1beta1-rabbitmqcluster
    failurePolicy: Fail
    name: vrabbitmqcluster-v1beta1.kb.io
    rules:
      - apiGroups:
          - rabbitmq.com
        apiVersions:
          - v1beta1
        operations:
          - CREATE
          - UPDATE
        resources:
          - rabbitmqclusters
    sideEffects: None
