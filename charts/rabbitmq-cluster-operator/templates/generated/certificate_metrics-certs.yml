---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: '{{ include "rabbitmq-cluster-operator.name" $ }}'
    app.kubernetes.io/instance: '{{ .Release.Name }}'
  name: '{{ include "rabbitmq-cluster-operator.fullname" $ }}-metrics-certs'
spec:
  dnsNames:
    - '{{ include "rabbitmq-cluster-operator.fullname" $ }}-metrics-certs.{{ .Release.Namespace }}.svc'
    - '{{ include "rabbitmq-cluster-operator.fullname" $ }}-metrics-certs.{{ .Release.Namespace }}.svc.{{ .Values.clusterDomain }}'
  issuerRef:
    kind: Issuer
    name: selfsigned-issuer
  secretName: rabbitmq-cluster-operator-metrics-server-cert
