---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: rabbitmq-operator
    app.kubernetes.io/name: {{ include "rabbitmq-cluster-operator.name" $ }}
    app.kubernetes.io/part-of: rabbitmq
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ include "rabbitmq-cluster-operator.fullname" $ }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "rabbitmq-cluster-operator.name" $ }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: rabbitmq-operator
        app.kubernetes.io/name: {{ include "rabbitmq-cluster-operator.name" $ }}
        app.kubernetes.io/part-of: rabbitmq
        app.kubernetes.io/instance: {{ .Release.Name }}
      {{- with .Values.podAnnotations  }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      containers:
        - args:
            - --health-probe-bind-address=:8081
          command:
            - /manager
          env:
            - name: OPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          image: {{ print .Values.image.registry "/" .Values.image.repository ":" (.Values.image.tag | default .Chart.AppVersion) }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          name: operator
          ports:
            - containerPort: 8080
              name: metrics
              protocol: TCP
            - containerPort: 9443
              name: webhook-server
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources: {{- .Values.resources | toYaml | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /tmp/k8s-webhook-server/serving-certs
              name: cluster-operator-webhook-certs
              readOnly: true
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.image.imagePullSecrets  }}
          imagePullSecrets: {{- toYaml . | nindent 12 }}
          {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: {{ include "rabbitmq-cluster-operator.fullname" $ }}
      terminationGracePeriodSeconds: 10
      volumes:
        - name: cluster-operator-webhook-certs
          secret:
            secretName: cluster-operator-webhook-server-cert
      {{- with .Values.nodeSelector  }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.toleratios  }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity  }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
