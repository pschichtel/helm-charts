{{- include "unifi-os-server.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "unifi-os-server.fullname" . }}
  labels:
    {{- include "unifi-os-server.labels" . | nindent 4 }}
spec:
  # Single-instance application with ReadWriteOnce storage: one replica, and
  # the old pod must be gone before the new one starts.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "unifi-os-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "unifi-os-server.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "unifi-os-server.serviceAccountName" . }}
      {{- with .Values.podHostname }}
      hostname: {{ . }}
      {{- end }}
      # Service links would inject variables such as RABBITMQ_PORT=tcp://...
      # for services in the namespace, clashing with the entrypoint's settings.
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: unifi-os-server
          image: {{ include "unifi-os-server.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # systemd needs a writable cgroup tree (see README)
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command: ["/boot-script/boot.sh"]
          env:
            - name: UOS_UUID
              value: {{ include "unifi-os-server.uuid" . | quote }}
            - name: UOS_SYSTEM_IP
              value: {{ .Values.console.systemIP | quote }}
            - name: UOS_PLATFORM
              value: {{ .Values.console.identity.platform | quote }}
            - name: UOS_PRODUCT_NAME
              value: {{ .Values.console.identity.productName | quote }}
            - name: UOS_APP_MODEL
              value: {{ .Values.console.identity.appModel | quote }}
            - name: UOS_VERSION
              value: {{ include "unifi-os-server.firmwareVersion" . | quote }}
            - name: UOS_LOG_FILES
              value: {{ join "\n" .Values.logs.files | quote }}
            - name: UOS_LOG_EXCLUDE
              value: {{ include "unifi-os-server.logExclude" . | quote }}
            {{- include "unifi-os-server.postgresEnv" . | nindent 12 }}
            {{- include "unifi-os-server.networkAppDataEnv" . | nindent 12 }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
            - name: https
              containerPort: 443
              protocol: TCP
            - name: inform
              containerPort: 8080
              protocol: TCP
            - name: stun
              containerPort: 3478
              protocol: UDP
            - name: speedtest
              containerPort: 6789
              protocol: TCP
            - name: portal-http
              containerPort: 8880
              protocol: TCP
            - name: portal-https
              containerPort: 8843
              protocol: TCP
          {{- if .Values.probes.enabled }}
          # core's API listens on 127.0.0.1 only, hence exec probes. The first
          # start of a restored app can take minutes (ubnt-dpkg-restore).
          startupProbe:
            exec:
              command: ["curl", "-sf", "-o", "/dev/null", "http://127.0.0.1:11081/api/info"]
            periodSeconds: 10
            failureThreshold: 120
          livenessProbe:
            exec:
              command: ["curl", "-sf", "-o", "/dev/null", "-m", "5", "http://127.0.0.1:11081/api/info"]
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            exec:
              command: ["sh", "-c", "nc -z 127.0.0.1 443 && nc -z 127.0.0.1 8080"]
            periodSeconds: 10
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: boot-script
              mountPath: /boot-script
              readOnly: true
            # persistent state: one volume, mounted in parts
            {{- range $path, $sub := dict "/data" "data" "/var/lib/unifi" "unifi-var-lib" "/srv" "srv" "/persistent" "persistent" }}
            - name: data
              mountPath: {{ $path }}
              subPath: {{ $sub }}
            {{- end }}
            # tmpfs as in the upstream compose file
            - name: run
              mountPath: /run
            - name: run-lock
              mountPath: /run/lock
            - name: tmp
              mountPath: /tmp
            - name: journal
              mountPath: /var/log/journal
            - name: unifi-tmp
              mountPath: /var/opt/unifi/tmp
            - name: core-http
              mountPath: /data/unifi-core/config/http
            {{- if .Values.rabbitmq.tls.enabled }}
            - name: rabbitmq-ca
              mountPath: /etc/rabbitmq-ca
              readOnly: true
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: boot-script
          configMap:
            name: {{ include "unifi-os-server.fullname" . }}-boot
            defaultMode: 0755
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "unifi-os-server.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: run
          emptyDir:
            medium: Memory
        - name: run-lock
          emptyDir:
            medium: Memory
        # tmpfs: a disk-backed mount would make systemd wait for its block device
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.tmpSizeLimit }}
        - name: journal
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.journalSizeLimit }}
        - name: unifi-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: core-http
          emptyDir:
            medium: Memory
        {{- if .Values.rabbitmq.tls.enabled }}
        - name: rabbitmq-ca
          secret:
            secretName: {{ .Values.rabbitmq.tls.caSecret }}
            items:
              - key: {{ .Values.rabbitmq.tls.caKey }}
                path: {{ .Values.rabbitmq.tls.caKey }}
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
