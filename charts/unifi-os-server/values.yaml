image:
  repository: ghcr.io/unihosted/unifi-os-server-docker
  pullPolicy: IfNotPresent
  # defaults to the chart appVersion
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

# fixed hostname of the pod (default: the pod name, which changes on every restart)
podHostname: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

# systemd in the container needs a writable cgroup tree; see the README
securityContext:
  privileged: true

console:
  # derived from the release namespace and name if empty
  # use `uuidgen --namespace @dns --name example.com --sha1` to generate one
  uuid: ""
  # address advertised to devices, e.g. the LoadBalancer IP
  systemIP: ""
  identity:
    platform: linux-x64
    productName: UniFi OS Server
    appModel: UOSSERVER
    # derived from the image tag if empty
    version: ""

postgresql:
  # PostgreSQL 14 that trusts the pod (no password) for every role; see the README.
  # every field reads `key` from Secret `name` (default: secretName), or takes a plain `value`
  secretName: ""
  host:
    key: host
  port:
    key: port

mongodb:
  secretName: ""
  # required, e.g. value: [mongodb-svc.db.svc.cluster.local:27017]
  hosts: {}
  replicaSet: {}
  authSource: {}  # default: admin
  username:
    key: username
  password:
    key: password
  database: {}  # default: ace
  statDatabase: {}  # default: ace_stat
  tls: false
  extraOptions: ""

rabbitmq:
  secretName: ""
  host:
    key: host
  port:
    key: port
  username:
    key: username
  password:
    key: password
  tls:
    enabled: false
    caSecret: ""
    caKey: ca.crt
    verifyHostname: true

# web (UI, ingress target) and device-facing ports are separate Services
service:
  web:
    type: ClusterIP
    annotations: {}
    loadBalancerSourceRanges: []
    externalTrafficPolicy: ""
    ports:
      http:
        enabled: true
        port: 80
        protocol: TCP
      https:
        enabled: true
        port: 443
        protocol: TCP
  # named <fullname>-device
  device:
    type: ClusterIP
    annotations: {}
    loadBalancerSourceRanges: []
    externalTrafficPolicy: ""
    ports:
      inform:
        enabled: true
        port: 8080
        protocol: TCP
      stun:
        enabled: true
        port: 3478
        protocol: UDP
      speedtest:
        enabled: true
        port: 6789
        protocol: TCP
      portal-http:
        enabled: false
        port: 8880
        protocol: TCP
      portal-https:
        enabled: false
        port: 8843
        protocol: TCP

ingress:
  enabled: false
  className: ""
  # the UI is HTTPS with a self-signed certificate, e.g. for ingress-nginx:
  # nginx.ingress.kubernetes.io/backend-protocol: HTTPS
  annotations: {}
  servicePort: https
  hosts:
    - unifi.example.com
  tls: []

persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  annotations: {}

# Container log: the journal of the UniFi units plus these files of the apps,
# minus lines matching any of the exclude patterns (extended regex); see README
logs:
  files:
    - /data/unifi/logs/server.log
    - /data/unifi-core/logs/system.log
    - /data/unifi-core/logs/errors.log
  exclude:
    - 'pam_unix\(sudo:session\)'
    - ' ; USER=[^;]* ; COMMAND='
    - 'from discovery agent fetch failed'
    - "Can't find lanIp from network interface"

journalSizeLimit: 256Mi
tmpSizeLimit: 1Gi

probes:
  enabled: true

resources: {}

extraEnv: []

terminationGracePeriodSeconds: 120

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}

