image:
  repository: ghcr.io/unihosted/unifi-os-server-docker
  pullPolicy: IfNotPresent
  # defaults to the chart appVersion
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

# fixed hostname of the pod (default: the pod name, which changes on every restart)
podHostname: ""

podAnnotations: {}
podLabels: {}

# the containers start as root and drop privileges per service
podSecurityContext: {}

securityContext: {}

console:
  # derived from the release namespace and name if empty
  # use `uuidgen --namespace @dns --name example.com --sha1` to generate one
  uuid: ""
  # address advertised to devices, e.g. the LoadBalancer IP
  systemIP: ""
  identity:
    platform: linux-x64
    productName: UniFi OS Server
    appModel: UOSSERVER
    # derived from the image tag if empty
    version: ""

postgresql:
  # every field reads `key` from Secret `name` (default: secretName), or takes a plain `value`
  auth:
    unifiCore:
      secretName: ""
      host:
        key: host
      port:
        key: port
      username:
        key: username
      password:
        key: password
      database: {}  # default: unifi-core
    ulpGo:
      secretName: ""
      host:
        key: host
      port:
        key: port
      username:
        key: username
      password:
        key: password
      database: {}  # default: ulp-go
      syslogDatabase: {}  # default: ulp-go-syslog
    uidAgent:
      secretName: ""
      host:
        key: host
      port:
        key: port
      username:
        key: username
      password:
        key: password
      database: {}  # default: uid
    ucsAgent:
      secretName: ""
      host:
        key: host
      port:
        key: port
      username:
        key: username
      password:
        key: password
      database: {}  # default: ucs-agent
    unifiDirectory:
      secretName: ""
      host:
        key: host
      port:
        key: port
      username:
        key: username
      password:
        key: password
      database: {}  # default: unifi-directory

mongodb:
  secretName: ""
  # required, e.g. value: [mongodb-svc.db.svc.cluster.local:27017]
  hosts: {}
  replicaSet: {}
  authSource: {}  # default: admin
  username:
    key: username
  password:
    key: password
  database: {}  # default: ace
  statDatabase: {}  # default: ace_stat
  tls: false
  extraOptions: ""

rabbitmq:
  secretName: ""
  host:
    key: host
  port:
    key: port
  username:
    key: username
  password:
    key: password
  tls:
    enabled: false
    caSecret: ""
    caKey: ca.crt
    verifyHostname: true

# web (UI, ingress target) and device-facing ports are separate Services
service:
  web:
    type: ClusterIP
    annotations: {}
    loadBalancerIP: ""
    loadBalancerSourceRanges: []
    externalTrafficPolicy: ""
    ports:
      http:
        enabled: true
        port: 80
        protocol: TCP
      https:
        enabled: true
        port: 443
        protocol: TCP
  # named <fullname>-device
  device:
    type: ClusterIP
    annotations: {}
    loadBalancerSourceRanges: []
    externalTrafficPolicy: ""
    ports:
      inform:
        enabled: true
        port: 8080
        protocol: TCP
      stun:
        enabled: true
        port: 3478
        protocol: UDP
      speedtest:
        enabled: true
        port: 6789
        protocol: TCP
      portal-http:
        enabled: false
        port: 8880
        protocol: TCP
      portal-https:
        enabled: false
        port: 8843
        protocol: TCP

ingress:
  enabled: false
  className: ""
  # the UI is HTTPS with a self-signed certificate, e.g. for ingress-nginx:
  # nginx.ingress.kubernetes.io/backend-protocol: HTTPS
  annotations: {}
  servicePort: https
  hosts:
    - unifi.example.com
  tls: []

persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  annotations: {}

logVolumeSizeLimit: 32Mi

probes:
  enabled: true

containers:
  unifiCore:
    uvThreadpoolSize: 256
    resources: {}
    extraEnv: []
  unifi:
    javaMaxHeap: 512M
    resources: {}
    extraEnv: []
  ulpGo:
    resources: {}
    extraEnv: []
  uidAgent:
    resources: {}
    extraEnv: []
  ucsAgent:
    resources: {}
    extraEnv: []
  unifiDirectory:
    resources: {}
    extraEnv: []
  unifiIdentityUpdate:
    resources: {}
    extraEnv: []
  uosAgent:
    resources: {}
    extraEnv: []
  uosDiscoveryClient:
    resources: {}
    extraEnv: []

terminationGracePeriodSeconds: 60

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}

