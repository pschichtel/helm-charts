# UniFi OS Server 5.1.42 — one container per component, no systemd.
#
# Data tier : standard images, reached by service name
#             unifi-os-server-mongodb (mongo), postgres, rabbitmq
# App tier  : all services join the network namespace of the idle `netns`
#             container (network_mode: service:netns) and share a /run volume,
#             so hardcoded loopback ports / unix sockets just work.
#
# First boot takes a few minutes: unifi-core generates the nginx site
# configs and cert, and the nginx service waits for that.

services:
  # ------------------------------- data tier -------------------------------
  unifi-os-server-mongodb:
    image: mongo:latest
    container_name: unifi-os-server-mongodb
    restart: unless-stopped
    volumes:
      - mongodb-data:/data/db
    # no auth by design (matches UOS defaults); enable MONGO_INITDB_ROOT_* if you need it
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping:1})"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  postgres:
    # must stay <=14: ulp-go emits `$1AND ...` SQL that PG>=15 rejects
    image: postgres:14
    container_name: unifi-os-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -h 127.0.0.1 -p 5432"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s

  rabbitmq:
    image: rabbitmq:latest
    container_name: unifi-os-rabbitmq
    restart: unless-stopped
    environment:
      # keep the historical node name so the mnesia volume carries over
      RABBITMQ_NODENAME: rabbit@localhost
      # safety net for a first start on an empty mnesia volume
      RABBITMQ_DEFAULT_USER: ui
      RABBITMQ_DEFAULT_PASS: ui
    entrypoint: ["/scripts/run-rabbitmq.sh"]
    volumes:
      - ./scripts:/scripts:ro
      - rabbitmq-mnesia:/var/lib/rabbitmq
      - rabbitmq-ssl:/etc/rabbitmq/ssl
    healthcheck:
      test: ["CMD-SHELL", "runuser -u rabbitmq -- env HOME=/var/lib/rabbitmq rabbitmq-diagnostics -q ping"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 30s

  # ------------------------------- app tier --------------------------------
  # Owns the shared network namespace and the published ports. It never
  # restarts, so unifi-core and every other app-tier service can restart freely
  # without orphaning the namespace of the containers that join it.
  netns:
    image: ${UOS_IMAGE}
    container_name: unifi-os-netns
    restart: unless-stopped
    init: true
    entrypoint: ["sleep", "infinity"]
    ports:
      - "${UI_HTTP_PORT}:80"
      - "${UI_HTTPS_PORT}:443"
      - "11084:11084"
      - "8080:8080"
      - "9443:9443"

  unifi-core:
    image: ${UOS_IMAGE}
    container_name: unifi-os-unifi-core
    restart: unless-stopped
    network_mode: service:netns
    entrypoint: ["/scripts/run-unifi-core.sh"]
    environment:
      UOS_UUID: ${UOS_UUID}
    volumes:
      - ./scripts:/scripts:ro
      - ./fake-sd1.js:/opt/fake-sd1.js:ro
      - unifi-core-data:/data/unifi-core
      - uos-run:/run
    depends_on:
      netns:
        condition: service_started
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 11081"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s

  unifi:
    image: ${UOS_IMAGE}
    container_name: unifi-os-unifi
    restart: unless-stopped
    network_mode: service:netns
    entrypoint: ["/scripts/run-unifi.sh"]
    environment:
      UOS_UUID: ${UOS_UUID}
      UOS_SYSTEM_IP: ${UOS_SYSTEM_IP}
      UNIFI_POSTGRESQL_HOST: postgres
      UNIFI_POSTGRESQL_PORT: "5432"
    volumes:
      - ./scripts:/scripts:ro
      - unifi-data:/data/unifi
      - rabbitmq-ssl:/etc/rabbitmq/ssl:ro
      - uos-run:/run
    depends_on:
      unifi-core:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      unifi-os-server-mongodb:
        condition: service_healthy
      postgres:
        condition: service_healthy

  ulp-go:
    image: ${UOS_IMAGE}
    container_name: unifi-os-ulp-go
    restart: unless-stopped
    network_mode: service:netns
    entrypoint: ["/scripts/run-ulp-go.sh"]
    # app-internal per-component log files; real logging goes to stdout
    tmpfs:
      - /data/ulp-go/log:uid=999,gid=999,size=32m
    volumes:
      - ./scripts:/scripts:ro
      - ./config/ulp-go.props:/etc/ulp-go/config.props:ro
      - ./config/logger/ulp-go.yaml:/usr/lib/ulp-go/configs/logger/prd.yaml:ro
      - ./meta/platform:/usr/lib/platform:ro
      - ./meta/product_name:/usr/lib/product_name:ro
      - ./meta/app_model:/usr/lib/app_model:ro
      - ./meta/version:/usr/lib/version:ro
      - ulp-go-data:/data/ulp-go
      - ulp-go-srv:/srv/ulp-go
      - uos-run:/run
    depends_on:
      unifi-core:
        condition: service_started
      postgres:
        condition: service_healthy

  uid-agent:
    image: ${UOS_IMAGE}
    container_name: unifi-os-uid-agent
    restart: unless-stopped
    network_mode: service:netns
    entrypoint: ["/scripts/run-uid-agent.sh"]
    volumes:
      - ./scripts:/scripts:ro
      - ./config/uid-agent.props:/etc/uid-agent/config.props:ro
      - ./config/logger/uid-agent.yaml:/usr/lib/uid-agent/logger.yaml:ro
      - ./meta/platform:/usr/lib/platform:ro
      - ./meta/product_name:/usr/lib/product_name:ro
      - ./meta/app_model:/usr/lib/app_model:ro
      - ./meta/version:/usr/lib/version:ro
      - uid-agent-data:/data/uid
      - uid-agent-srv:/srv/uid
      - uos-run:/run
    depends_on:
      unifi-core:
        condition: service_started
      postgres:
        condition: service_healthy

  unifi-directory:
    image: ${UOS_IMAGE}
    container_name: unifi-os-unifi-directory
    restart: unless-stopped
    network_mode: service:netns
    entrypoint: ["/scripts/run-unifi-directory.sh"]
    # app-internal per-component log files; real logging goes to stdout
    tmpfs:
      - /data/unifi-directory/log:uid=979,gid=979,size=32m
    volumes:
      - ./scripts:/scripts:ro
      - ./config/unifi-directory.props:/etc/unifi-directory/config.props:ro
      - ./meta/platform:/usr/lib/platform:ro
      - ./meta/product_name:/usr/lib/product_name:ro
      - ./meta/app_model:/usr/lib/app_model:ro
      - ./meta/version:/usr/lib/version:ro
      - unifi-directory-data:/data/unifi-directory
      - uos-run:/run
    depends_on:
      unifi-core:
        condition: service_started
      postgres:
        condition: service_healthy

  ucs-agent:
    image: ${UOS_IMAGE}
    container_name: unifi-os-ucs-agent
    restart: unless-stopped
    network_mode: service:netns
    entrypoint: ["/scripts/run-ucs-agent.sh"]
    # app-internal per-component log files; real logging goes to stdout
    tmpfs:
      - /data/ucs-agent/log:uid=975,gid=976,size=32m
    volumes:
      - ./scripts:/scripts:ro
      - ./config/ucs-agent.props:/etc/ucs-agent/config.props:ro
      - ./config/logger/ucs-agent.yaml:/usr/lib/ucs-agent/configs/logger/prd.yaml:ro
      - ./meta/platform:/usr/lib/platform:ro
      - ./meta/product_name:/usr/lib/product_name:ro
      - ./meta/app_model:/usr/lib/app_model:ro
      - ./meta/version:/usr/lib/version:ro
      - ucs-agent-data:/data/ucs-agent
      - uos-run:/run
    depends_on:
      unifi-core:
        condition: service_started
      postgres:
        condition: service_healthy

  unifi-identity-update:
    image: ${UOS_IMAGE}
    container_name: unifi-os-unifi-identity-update
    restart: unless-stopped
    network_mode: service:netns
    entrypoint: ["/scripts/run-unifi-identity-update.sh"]
    # app-internal log files (only written on errors); real logging goes to stdout
    tmpfs:
      - /var/log/unifi_package-identity-update:uid=974,gid=975,size=32m
    volumes:
      - ./scripts:/scripts:ro
      - ./config/unifi-identity-update.props:/etc/unifi-identity-update/config.props:ro
      - ./config/logger/unifi-identity-update.yaml:/usr/lib/unifi-identity-update/configs/logger/prd.yaml:ro
      - ./meta/platform:/usr/lib/platform:ro
      - ./meta/product_name:/usr/lib/product_name:ro
      - ./meta/app_model:/usr/lib/app_model:ro
      - ./meta/version:/usr/lib/version:ro
      - identity-update-data:/data/unifi-identity-update
      - uos-run:/run
    depends_on:
      unifi-core:
        condition: service_started
      postgres:
        condition: service_healthy

  # Image units `uos-agent` / `uos-discovery-client` (Rust, run as root in the
  # stock image). uos-agent serves the uosAgent API (11010/11011) that
  # unifi-core calls (e.g. /api/v2/identity/status).
  uos-agent:
    image: ${UOS_IMAGE}
    container_name: unifi-os-uos-agent
    restart: unless-stopped
    network_mode: service:netns
    entrypoint: ["/usr/bin/uos-agent"]
    volumes:
      - ./meta/platform:/usr/lib/platform:ro
      - ./meta/product_name:/usr/lib/product_name:ro
      - ./meta/app_model:/usr/lib/app_model:ro
      - ./meta/version:/usr/lib/version:ro
      - uos-data:/data/uos
      - uos-run:/run
    depends_on:
      unifi-core:
        condition: service_started

  uos-discovery-client:
    image: ${UOS_IMAGE}
    container_name: unifi-os-uos-discovery-client
    restart: unless-stopped
    network_mode: service:netns
    entrypoint: ["/usr/bin/uos-discovery-client"]
    volumes:
      - ./meta/platform:/usr/lib/platform:ro
      - ./meta/product_name:/usr/lib/product_name:ro
      - ./meta/app_model:/usr/lib/app_model:ro
      - ./meta/version:/usr/lib/version:ro
      - uos-run:/run
    depends_on:
      unifi-core:
        condition: service_started

volumes:
  mongodb-data:
  postgres-data:
  rabbitmq-mnesia:
  rabbitmq-ssl:
  unifi-core-data:
  unifi-data:
  ulp-go-data:
  ulp-go-srv:
  uid-agent-data:
  uid-agent-srv:
  unifi-directory-data:
  ucs-agent-data:
  identity-update-data:
  uos-run:
  uos-data:
