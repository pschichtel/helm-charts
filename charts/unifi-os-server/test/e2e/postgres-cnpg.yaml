# PostgreSQL for the end-to-end test: one CloudNativePG cluster. The UniFi
# apps create their own roles and databases as the superuser "postgres", as on
# a stock console, so the server trusts every connection (see the chart
# README). Must be version 14: ulp-go sends "c.relname = $1AND", which
# PostgreSQL 15+ rejects.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: unifi-pg
  namespace: unifi
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:14.21-standard-trixie
  storage:
    size: 1Gi
  # the app secret (unifi-pg-app) provides host and port for the chart
  bootstrap:
    initdb:
      database: app
      owner: app
  postgresql:
    pg_hba:
      - host all all all trust
---
# Same policy as the umbrella example (templates/postgresql/networkpolicy.yaml),
# rendered for release "uos" in namespace "unifi".
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: unifi-pg
  namespace: unifi
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: unifi-pg
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: unifi-os-server
              app.kubernetes.io/instance: uos
      ports:
        - port: 5432
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: unifi-pg
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
      ports:
        - port: 8000
  egress:
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: unifi-pg
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # The API server is not a pod; most CNIs match its endpoint address
    # (port 6443), some the Service address (443).
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
        - port: 6443
