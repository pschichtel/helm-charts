# Additional chart values when PostgreSQL is provisioned with db-operator
# (postgres-db-operator.yaml). Its credentials Secrets have the keys
# POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD but no host or port, which
# are given as plain values here.
postgresql:
  auth:
    unifiCore:
      secretName: unifi-pg-unifi-core           # generated by db-operator
      host:
        value: unifi-pg-rw
      port:
        value: "5432"
      username:
        key: POSTGRES_USER
      password:
        key: POSTGRES_PASSWORD
      database:
        key: POSTGRES_DB
    ulpGo:
      secretName: unifi-pg-ulp-go               # pre-created, fixed user name
      host:
        value: unifi-pg-rw
      port:
        value: "5432"
      username:
        key: POSTGRES_USER
      password:
        key: POSTGRES_PASSWORD
      database:
        key: POSTGRES_DB
      # the second Database's generated name, from its own Secret
      syslogDatabase:
        name: unifi-pg-ulp-go-syslog
        key: POSTGRES_DB
    uidAgent:
      secretName: unifi-pg-uid
      host:
        value: unifi-pg-rw
      port:
        value: "5432"
      username:
        key: POSTGRES_USER
      password:
        key: POSTGRES_PASSWORD
      database:
        key: POSTGRES_DB
    ucsAgent:
      secretName: unifi-pg-ucs-agent
      host:
        value: unifi-pg-rw
      port:
        value: "5432"
      username:
        key: POSTGRES_USER
      password:
        key: POSTGRES_PASSWORD
      database:
        key: POSTGRES_DB
    unifiDirectory:
      secretName: unifi-pg-unifi-directory
      host:
        value: unifi-pg-rw
      port:
        value: "5432"
      username:
        key: POSTGRES_USER
      password:
        key: POSTGRES_PASSWORD
      database:
        key: POSTGRES_DB
