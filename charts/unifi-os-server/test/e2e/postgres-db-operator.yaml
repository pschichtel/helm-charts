# PostgreSQL for the end-to-end test, provisioned with db-operator
# (kinda.rocks): CloudNativePG only runs the server, db-operator creates the
# databases and roles. Used when POSTGRES_PROVISIONER=db-operator.
#
# db-operator names databases and users "<namespace>-<resource name>", but
# the Go services must log in as roles with fixed names (their schema
# migrations assign ownership to them). db-operator reuses a credentials
# Secret that already exists, so those Secrets are created up front with the
# fixed user name, the database name and a password.

# --- PostgreSQL server. Must be version 14 or older: ulp-go sends
# "c.relname = $1AND" which PostgreSQL 15+ rejects (see the repository
# README). The superuser secret (unifi-pg-superuser) is db-operator's admin.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: unifi-pg
  namespace: unifi
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:14.21-standard-trixie
  enableSuperuserAccess: true
  storage:
    size: 1Gi
---
# kinda.rocks/v1beta1: db-operator 2.44 does not serve DbInstance v1 yet.
# The admin secret is read from the keys "user" (default "postgres") and
# "password"; CloudNativePG's superuser secret has "username" = postgres and
# "password", which works through that default.
apiVersion: kinda.rocks/v1beta1
kind: DbInstance
metadata:
  name: unifi-pg
spec:
  engine: postgres
  adminSecretRef:          # field names are capitalised in v1beta1
    Namespace: unifi
    Name: unifi-pg-superuser
  generic:
    host: unifi-pg-rw.unifi.svc.cluster.local
    port: 5432
---
# --- unifi-core: any user works, names and password generated by db-operator
# (secret unifi-pg-unifi-core: POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD).
apiVersion: kinda.rocks/v1beta1
kind: Database
metadata:
  name: unifi-core
  namespace: unifi
spec:
  instance: unifi-pg
  secretName: unifi-pg-unifi-core
  deletionProtected: false
  postgres: {}
---
# --- Go services: pre-created secrets with the fixed role names.
apiVersion: v1
kind: Secret
metadata:
  name: unifi-pg-ulp-go
  namespace: unifi
stringData:
  POSTGRES_DB: ulp-go
  POSTGRES_USER: ulp-go
  POSTGRES_PASSWORD: e2eUlpGoPassw0rd
---
apiVersion: kinda.rocks/v1beta1
kind: Database
metadata:
  name: ulp-go
  namespace: unifi
spec:
  instance: unifi-pg
  secretName: unifi-pg-ulp-go
  deletionProtected: false
  postgres: {}
---
# ulp-go's second database, for the same user: existingUser makes ulp-go its
# main user (full privileges) without creating or deleting the role. The
# database name is generated: unifi-ulp-go-syslog.
apiVersion: kinda.rocks/v1beta1
kind: Database
metadata:
  name: ulp-go-syslog
  namespace: unifi
spec:
  instance: unifi-pg
  secretName: unifi-pg-ulp-go-syslog
  existingUser: ulp-go
  deletionProtected: false
  postgres: {}
---
apiVersion: v1
kind: Secret
metadata:
  name: unifi-pg-uid
  namespace: unifi
stringData:
  POSTGRES_DB: uid
  POSTGRES_USER: uid
  POSTGRES_PASSWORD: e2eUidPassw0rd
---
apiVersion: kinda.rocks/v1beta1
kind: Database
metadata:
  name: uid
  namespace: unifi
spec:
  instance: unifi-pg
  secretName: unifi-pg-uid
  deletionProtected: false
  postgres: {}
---
apiVersion: v1
kind: Secret
metadata:
  name: unifi-pg-ucs-agent
  namespace: unifi
stringData:
  POSTGRES_DB: ucs-agent
  POSTGRES_USER: ucs-agent
  POSTGRES_PASSWORD: e2eUcsAgentPassw0rd
---
apiVersion: kinda.rocks/v1beta1
kind: Database
metadata:
  name: ucs-agent
  namespace: unifi
spec:
  instance: unifi-pg
  secretName: unifi-pg-ucs-agent
  deletionProtected: false
  postgres: {}
---
apiVersion: v1
kind: Secret
metadata:
  name: unifi-pg-unifi-directory
  namespace: unifi
stringData:
  POSTGRES_DB: unifi-directory
  POSTGRES_USER: unifi-directory
  POSTGRES_PASSWORD: e2eDirectoryPassw0rd
---
apiVersion: kinda.rocks/v1beta1
kind: Database
metadata:
  name: unifi-directory
  namespace: unifi
spec:
  instance: unifi-pg
  secretName: unifi-pg-unifi-directory
  deletionProtected: false
  postgres: {}
