# Local test cluster for the end-to-end test.
# kube-proxy in nftables mode (GA since Kubernetes 1.33). See setup.sh for
# a workaround needed on kernels without nft_numgen/xt_statistic.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: uos-e2e
networking:
  kubeProxyMode: nftables
nodes:
  - role: control-plane
