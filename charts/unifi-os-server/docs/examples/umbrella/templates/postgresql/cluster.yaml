# PostgreSQL 14, pinned: ulp-go sends SQL that 15+ rejects. The UniFi apps
# create their own roles and databases as "postgres" over a password-less
# connection, so the server trusts every connection (see the chart README).
# The generated Secret unifi-pg-app provides host and port.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: unifi-pg
spec:
  instances: {{ .Values.cnpg.instances }}
  imageName: ghcr.io/cloudnative-pg/postgresql:14.21-standard-trixie
  storage:
    size: {{ .Values.cnpg.storage.size }}
    {{- with .Values.cnpg.storage.storageClass }}
    storageClass: {{ . }}
    {{- end }}
  {{- with .Values.cnpg.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  bootstrap:
    initdb:
      database: app
      owner: app
  postgresql:
    pg_hba:
      - host all all all trust
