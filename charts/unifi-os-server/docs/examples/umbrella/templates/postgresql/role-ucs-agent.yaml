# databaseRoleReclaimPolicy: retain keeps the role when this resource is deleted.
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: unifi-pg-ucs-agent
spec:
  cluster:
    name: unifi-pg
  name: ucs-agent
  login: true
  databaseRoleReclaimPolicy: retain
  passwordSecret:
    name: unifi-pg-ucs-agent
