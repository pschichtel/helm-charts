# databaseRoleReclaimPolicy: retain keeps the role when this resource is deleted.
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: unifi-pg-ulp-go
spec:
  cluster:
    name: unifi-pg
  name: ulp-go
  login: true
  databaseRoleReclaimPolicy: retain
  passwordSecret:
    name: unifi-pg-ulp-go
