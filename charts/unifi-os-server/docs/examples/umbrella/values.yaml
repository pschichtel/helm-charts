# Settings of the data services in this stack; everything under
# `unifi-os-server:` is passed to the chart itself.
cnpg:
  instances: 3
  storage:
    size: 10Gi
    storageClass: ""
  resources: {}
  # in: only the UniFi pod, the cluster's own pods and the operator;
  # out: the cluster's own pods, DNS and the Kubernetes API
  networkPolicy:
    enabled: true
    operatorNamespace: cnpg-system
    # narrow to the API server's addresses (kubectl get endpointslices -n default)
    apiServerCIDRs: [0.0.0.0/0]
    # further rules, e.g. metrics scraping on port 9187 or backups to object storage
    extraIngress: []
    extraEgress: []

mongodb:
  members: 1
  version: "8.0.38"
  storage:
    size: 5Gi
    storageClass: ""
  # the operator's service account for the replica set pods, only needed if the
  # MongoDB operator is not installed in this namespace
  createAppdbRbac: true

rabbitmq:
  replicas: 1
  storage:
    size: 2Gi
    storageClass: ""

# Names are fixed (not derived from the release) because subchart values
# cannot be templated: install one stack per namespace.
unifi-os-server:
  # Typical exposure: devices reach inform/STUN through a LoadBalancer, the UI
  # stays on the ClusterIP Service behind an ingress.
  # console:
  #   systemIP: 192.0.2.10
  # service:
  #   device:
  #     type: LoadBalancer
  #     externalTrafficPolicy: Local
  # ingress:
  #   enabled: true
  #   hosts: [unifi.example.com]
  #   # e.g. HAProxy (haproxytech); HTTP/1.1 to the backend is required, see
  #   # "Ingress and reverse proxies" in the chart README
  #   className: haproxy
  #   annotations:
  #     haproxy.org/server-ssl: "true"
  #     haproxy.org/server-proto: "h1"
  postgresql:
    secretName: unifi-pg-app
  mongodb:
    secretName: unifi-mongo-admin-unifi
    hosts:
      value: [unifi-mongo-svc:27017]
    replicaSet:
      value: unifi-mongo
  rabbitmq:
    secretName: unifi-rmq-default-user
