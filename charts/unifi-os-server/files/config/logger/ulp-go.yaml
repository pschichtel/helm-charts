loggers:
  - name: default
    level: info
    std: true
    force_color: false # force color output, by default it's false. only used for unit testing
  - name: "uumgo/*" # only print info log of uumgo/* loggers
    level: info

# every logger group has a file, which will write all the loggers into the files.
# Everything is logged to stdout. The library always keeps a file group for the
# "default" group (one <prefix>.log per logger prefix) and recreates it with
# defaults if absent, so keep it but raise it to "error": files are then only
# created once an error is logged (levels above "error" are not accepted and
# silently fall back to "info").
groups:
  - file: "default"
    loggers: [ "*" ]
    level: "error"
