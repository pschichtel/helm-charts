---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/instance: '{{ .Release.Name }}'
    app.kubernetes.io/name: '{{ include "keycloak-operator.name" $ }}'
    app.kubernetes.io/version: '{{ .Chart.AppVersion }}'
  name: '{{ include "keycloak-operator.fullname" $ }}samlclientcontroller-cluster-role'
  annotations: {}
rules:
  - apiGroups:
      - k8s.keycloak.org
    resources:
      - keycloaksamlclients
      - keycloaksamlclients/status
      - keycloaksamlclients/finalizers
    verbs:
      - get
      - list
      - watch
      - patch
      - update
      - create
      - delete
