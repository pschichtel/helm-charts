{{- if .Values.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dawarich.fullname" . }}-sidekiq
  labels:
    {{- include "dawarich.labelsSidekiq" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ include "dawarich.prometheusPort" . }}
      targetPort: prometheus
      protocol: TCP
      name: prometheus
  selector:
    {{- include "dawarich.selectorLabelsSidekiq" . | nindent 4 }}
{{- end }}
