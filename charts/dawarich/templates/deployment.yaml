apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dawarich.fullname" . }}
  labels:
    {{- include "dawarich.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.dawarich.replicaCount }}
  selector:
    matchLabels:
      {{- include "dawarich.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
        checksum/configmap: {{ ((include (print $.Template.BasePath "/configmap.yaml") $) | fromYaml).data | toYaml | sha256sum }}
        checksum/secret: {{ ((include (print $.Template.BasePath "/secret.yaml") $) | fromYaml).data | toYaml | sha256sum }}
      labels:
        {{- include "dawarich.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "dawarich.podSecurityContext" . | nindent 6 }}
      terminationGracePeriodSeconds: 60
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.image }}
          {{- if .digest }}
          image: {{ print .registry "/" .repository "@" .digest | quote }}
          {{- else }}
          image: {{ print .registry "/" .repository ":" (.tag | default $.Chart.AppVersion) | quote }}
          {{- end }}
          imagePullPolicy: {{ .pullPolicy }}
          {{- end }}
          command: ['web-entrypoint.sh']
          args: ['bin/rails', 'server', '-p', '3000', '-b', '::']
          envFrom:
            {{- include "dawarich.envFrom" . | nindent 12 }}
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: RAILS_ENV
              value: 'production'
            - name: RAILS_LOG_TO_STDOUT
              value: 'true'
            - name: TMPDIR
              value: '/tmp'
          {{/* SELF_HOSTED is required in Dawarich >=0.25.4 */}}
            - name: SELF_HOSTED
              value: "true"
            - name: SIDEKIQ_EMBEDDED
              value: "true"
            - name: WEB_CONCURRENCY
              value: "0"
            - name: BACKGROUND_PROCESSING_CONCURRENCY
              value: {{ .Values.dawarich.backgroundProcessingConcurrency | quote }}
            - name: APPLICATION_HOSTS
              value: {{ print (join "," .Values.dawarich.hosts) ",$(POD_IP):" .Values.service.port | quote }}
            - name: DOMAIN
              value: {{ .Values.dawarich.hosts | first | quote }}
            - name: TIME_ZONE
              value: {{ .Values.dawarich.timeZone | quote }}
            {{- include "dawarich.secretValueEnvRef" (dict "EnvName" "DATABASE_HOST" "Key" "postgresHost" "Value" .Values.postgresql.host "Root" .) | nindent 12 }}
            {{- include "dawarich.secretValueEnvRef" (dict "EnvName" "DATABASE_PORT" "Key" "postgresPort" "Value" .Values.postgresql.port "Root" .) | nindent 12 }}
            {{- include "dawarich.secretValueEnvRef" (dict "EnvName" "DATABASE_NAME" "Key" "postgresDatabase" "Value" .Values.postgresql.auth.database "Root" .) | nindent 12 }}
            {{- include "dawarich.secretValueEnvRef" (dict "EnvName" "DATABASE_USERNAME" "Key" "postgresUsername" "Value" .Values.postgresql.auth.username "Root" .) | nindent 12 }}
            {{- include "dawarich.secretValueEnvRef" (dict "EnvName" "DATABASE_PASSWORD" "Key" "postgresPassword" "Value" .Values.postgresql.auth.password "Root" .) | nindent 12 }}
            {{- if .Values.redis.auth }}
            {{- include "dawarich.secretValueEnvRef" (dict "EnvName" "A_REDIS_PASSWORD" "Key" "redisPassword" "Value" .Values.redis.password "Root" .) | nindent 12 }}
            {{- end }}
            - name: REDIS_URL
          {{- $redisAddr := print (tpl .Values.redis.host .) ":" .Values.redis.port }}
          {{- if .Values.redis.auth }}
              value: {{ print "redis://:$(A_REDIS_PASSWORD)@" $redisAddr | quote }}
          {{- else }}
              value: {{ print "redis://" $redisAddr | quote }}
            {{- end }}
            {{- include "dawarich.secretValueEnvRef" (dict "EnvName" "SECRET_KEY_BASE" "Key" "keyBase" "Value" .Values.keyBase "Root" .) | nindent 12 }}
            {{- if .Values.oidc.enabled }}
            {{- include "dawarich.secretValueEnvRef" (dict "EnvName" "OIDC_CLIENT_ID" "Key" "oidcClientId" "Value" .Values.oidc.clientId "Root" .) | nindent 12 }}
            {{- include "dawarich.secretValueEnvRef" (dict "EnvName" "OIDC_CLIENT_SECRET" "Key" "oidcClientSecret" "Value" .Values.oidc.clientSecret "Root" .) }}
            - name: OIDC_ISSUER
              value: {{ .Values.oidc.issuer | quote }}
            - name: OIDC_REDIRECT_URI
              value: {{ .Values.oidc.redirectUri | quote }}
            - name: OIDC_AUTO_REGISTER
              value: {{ .Values.oidc.autoRegister | quote }}
            - name: OIDC_PROVIDER_NAME
              value: {{ .Values.oidc.providerName | quote }}
            - name: ALLOW_EMAIL_PASSWORD_REGISTRATION
              value: {{ .Values.oidc.allowEmailPasswordRegistration | quote }}
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - name: PROMETHEUS_EXPORTER_ENABLED
              value: "true"
            - name: PROMETHEUS_EXPORTER_HOST
              value: "0.0.0.0"
            - name: PROMETHEUS_EXPORTER_PORT
              value: "{{ include "dawarich.prometheusPort" . }}"
            {{- include "dawarich.secretValueEnvRef" (dict "EnvName" "METRICS_USERNAME" "Key" "metricsUsername" "Value" .Values.metrics.username "Root" .) | nindent 12 }}
            {{- include "dawarich.secretValueEnvRef" (dict "EnvName" "METRICS_PASSWORD" "Key" "metricsPassword" "Value" .Values.metrics.password "Root" .) | nindent 12 }}
            {{- end }}
            {{- if .Values.photon.enabled }}
            {{- with .Values.photon.host }}
            - name: PHOTON_API_HOST
              value: "{{ . }}"
            {{- end }}
            - name: PHOTON_API_USE_HTTPS
              value: "{{ .Values.photon.useHttps }}"
            {{- include "dawarich.secretValueEnvRef" (dict "EnvName" "PHOTON_API_KEY" "Key" "photonApiKey" "Value" .Values.photon.apiKey "Optional" true "Root" .) }}
            - name: STORE_GEODATA
              value: "{{ .Values.photon.store }}"
            {{- end }}
          {{- include "dawarich.securityContext" . | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            {{- include "dawarich.livenessProbe" . | nindent 12 }}
          readinessProbe:
            {{- include "dawarich.readinessProbe" . | nindent 12 }}
          startupProbe:
            {{- include "dawarich.startupProbe" . | nindent 12 }}
          resources:
            {{- toYaml .Values.dawarich.resources | nindent 12 }}
          volumeMounts:
            {{- include "dawarich.volumeMounts" . | trim | nindent 12 }}
      volumes:
        {{- include "dawarich.volumes" . | trim | nindent 8 }}
      {{- with .Values.dawarich.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dawarich.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dawarich.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
