apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dawarich.fullname" . }}-sidekiq
  labels:
    {{- include "dawarich.labelsSidekiq" . | nindent 4 }}
spec:
  replicas: {{ .Values.sidekiq.replicaCount }}
  selector:
    matchLabels:
      {{- include "dawarich.selectorLabelsSidekiq" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
        checksum/configmap: {{ ((include (print $.Template.BasePath "/configmap.yaml") $) | fromYaml).data | toYaml | sha256sum }}
        checksum/secret: {{ ((include (print $.Template.BasePath "/secret.yaml") $) | fromYaml).data | toYaml | sha256sum }}
      labels:
        {{- include "dawarich.labelsSidekiq" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "dawarich.podSecurityContext" . | nindent 6 }}
      containers:
        - name: {{ .Chart.Name }}-sidekiq
          {{- with .Values.image }}
          {{- if .digest }}
          image: {{ print .registry "/" .repository "@" .digest | quote }}
          {{- else }}
          image: {{ print .registry "/" .repository ":" (.tag | default $.Chart.AppVersion) | quote }}
          {{- end }}
          imagePullPolicy: {{ .pullPolicy }}
          {{- end }}
          command: ['sidekiq-entrypoint.sh']
          envFrom:
            {{- include "dawarich.envFrom" . | nindent 12 }}
          env:
            {{- include "dawarich.env" . | nindent 12 }}
          {{- include "dawarich.securityContext" . | nindent 10 }}
          {{- if .Values.metrics.enabled }}
          ports:
            - name: prometheus
              containerPort: {{ include "dawarich.prometheusPort" . }}
              protocol: TCP
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.sidekiq.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.sidekiq.readinessProbe | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.sidekiq.startupProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.sidekiq.resources | nindent 12 }}
          volumeMounts:
            {{- include "dawarich.sidekiqVolumeMounts" . | trim | nindent 12 }}
      volumes:
        {{- include "dawarich.volumes" . | trim | nindent 8 }}
      {{- with .Values.sidekiq.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.sidekiq.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.sidekiq.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
