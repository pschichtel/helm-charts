# Default values for dawarich.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  registry: docker.io
  repository: freikin/dawarich
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""
  digest: null

secret:
  create: true
  stringData:
    keyBase: changeme
    postgresHost: null
    postgresPort: null
    postgresDatabase: null
    postgresUsername: null
    postgresPassword: null
    redisPassword: null
    photonApiKey: null
    oidcClientId: null
    oidcClientSecret: null
    metricsUsername: metrics
    metricsPassword: metrics
    s3Endpoint: null
    s3Region: null
    s3Bucket: null
    s3AccessKey: null
    s3SecretKey: null

keyBase:
  key: keyBase

env:
  minMinutesSpentInCity: "60"
  timeZone: "Europe/Berlin"
  backgroundProcessingConcurrency: "10"
  applicationProtocol: "http"
  distanceUnit: "km"

# Optional: Specify an existing secret to load all environment variables from
existingEnvSecret: null

# See https://dawarich.app/docs/tutorials/reverse-geocoding
photon:
  enabled: true
  host: null
  useHttps: true
  apiKey: null
  store: true

# OIDC (OpenID Connect) authentication configuration
oidc:
  enabled: false
  providerName: "OpenID Connect"

  clientId:
    key: oidcClientId
  clientSecret:
    key: oidcClientSecret

  issuer: ""
  redirectUri: ""

  autoRegister: false
  allowEmailPasswordRegistration: true

dawarich:
  replicaCount: 1
  hosts:
    - "dawarich.example.org"
  backgroundProcessingConcurrency: 2
  timeZone: Europe/Berlin

  resources: {}
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # limits:
    #   cpu: 100m
    #   memory: 256Mi
    # requests:
    #   cpu: 500m
    #   memory: 2Gi

  nodeSelector: {}

  tolerations: []

  affinity: {}

  # Additional volumes on the output Deployment definition.
  extraVolumes: []

  # Additional volumeMounts on the output Deployment definition.
  extraVolumeMounts: []

persistence:
  # local or s3
  backend: local
  s3:
    endpoint:
      key: s3Endpoint
    region:
      key: s3Region
    bucket:
      key: s3Bucket
    accessKey:
      key: s3AccessKey
    secretKey:
      key: s3SecretKey
  local:
    # This volume mounts to /var/app/storage
    enabled: true
    existingClaim: ""
    annotations: []
    accessMode: "ReadWriteOnce"
    storageClass: ""
    size: 5Gi

postgresql:
  host:
    key: postgresHost
  port:
    key: postgresPort

  auth:
    database:
      key: postgresDatabase
    username:
      key: postgresUsername
    password:
      key: postgresPassword

redis:
  host: '{{ .Release.Name }}-bundled-redis'
  port: 6379
  auth: true
  password:
    key: redisPassword

# This is for the secretes for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 3000

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

metrics:
  enabled: false
  username:
    key: metricsUsername
  password:
    key: metricsPassword
  serviceMonitor:
    enabled: false
