---
# https://github.com/roundcube/roundcubemail-docker/blob/master/README.md#configurationenvironment-variables
{{- $configMapResourceChecksum := include (print $.Template.BasePath "/configmap.yaml") . | sha256sum -}}
{{- $secretResourceChecksum := include (print $.Template.BasePath "/secret.yaml") . | sha256sum -}}
{{- $configChecksum := printf "%s %s" $configMapResourceChecksum $secretResourceChecksum | sha256sum }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "roundcube.fullname" . }}
  labels:
    {{- include "roundcube.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.deployment.replicas }}
  strategy:
    {{ .Values.deployment.strategy | toYaml | nindent 4 }}
  selector:
    matchLabels:
      {{- include "roundcube.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "roundcube.labels" . | nindent 8 }}
        {{- with .Values.deployment.additionalPodLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        roundcube/config-checksum: {{ $configChecksum }}
        {{- with .Values.deployment.additionalPodAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if .Values.deployment.initContainers }}
      initContainers:
        {{- with .Values.deployment.initContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: roundcubemail
          image: {{ tpl .Values.image . }}
          imagePullPolicy: {{ .Values.imagePullPolicy | default "IfNotPresent" }}
          securityContext:
            runAsUser: 82
            runAsGroup: 82
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
          env:
            - name: ROUNDCUBEMAIL_DEFAULT_HOST
              value: "{{ include "roundcube.encryption" .Values.imap.encryption }}{{ required "no IMAP host defined" .Values.imap.host }}"
            - name: ROUNDCUBEMAIL_DEFAULT_PORT
              value: "{{ .Values.imap.port }}"
            - name: ROUNDCUBEMAIL_SMTP_SERVER
              value: "{{ include "roundcube.encryption" .Values.smtp.encryption }}{{ required "no SMTP host defined" .Values.smtp.host }}"
            - name: ROUNDCUBEMAIL_SMTP_PORT
              value: "{{ .Values.smtp.port }}"
            - name: ROUNDCUBEMAIL_SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "roundcube.fullname" . }}
                  key: smtpUsername
            - name: ROUNDCUBEMAIL_SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "roundcube.fullname" . }}
                  key: smtpPassword
            - name: ROUNDCUBEMAIL_DES_KEY
              valueFrom:
                secretKeyRef:
                  {{- $desKey := .Values.config.desKey | required "config.desKey is required!" }}
                  {{- if kindIs "string" $desKey }}
                  name: {{ include "roundcube.fullname" . }}
                  key: desKey
                  {{- else }}
                  name: {{ $desKey.name }}
                  key: {{ $desKey.key }}
                  {{- end }}
            - name: ROUNDCUBEMAIL_LANGUAGE
              value: "{{ .Values.config.defaultLanguage }}"
            - name: ROUNDCUBEMAIL_PLUGINS
              value: "{{ include "roundcube.plugins.list" . }}"
            - name: ROUNDCUBEMAIL_COMPOSER_PLUGINS
              value: "{{ include "roundcube.plugins.requirements" . }} {{ include "roundcube.skins.requirements" . }}"
            - name: ROUNDCUBEMAIL_SKIN
              value: "{{ .Values.config.defaultSkin }}"
            - name: ROUNDCUBEMAIL_UPLOAD_MAX_FILESIZE
              value: "{{ .Values.config.uploadMaxFilesize }}"
            - name: ROUNDCUBEMAIL_DB_TYPE
              value: "{{ .Values.database.type }}"
            - name: ROUNDCUBEMAIL_DB_HOST
              value: "{{ required "No database host configured" .Values.database.host }}"
            - name: ROUNDCUBEMAIL_DB_PORT
              value: "{{ .Values.database.port }}"
            - name: ROUNDCUBEMAIL_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "roundcube.fullname" . }}
                  key: dbUsername
            - name: ROUNDCUBEMAIL_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "roundcube.fullname" . }}
                  key: dbPassword
            - name: ROUNDCUBEMAIL_DB_NAME
              value: "{{ .Values.database.name }}"
            - name: COMPOSER_ALLOW_SUPERUSER
              value: "1"
            {{- with .Values.deployment.additionalEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /usr/local/etc/php/conf.d/zz-roundcube.ini
              subPath: roundcube.ini
            - name: config
              mountPath: /usr/local/etc/php/conf.d/zzz-custom.ini
              subPath: php.ini
            - name: config
              mountPath: /var/roundcube/config/custom.php
              subPath: roundcube.config.php
            - name: config
              mountPath: /usr/local/etc/php-fpm.d/zzz-custom.conf
              subPath: php-fpm.conf
            - name: shared-files
              mountPath: /var/www/html
            {{- with $.Values.deployment.additionalVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{ if .Values.deployment.resources }}
          resources: {{ .Values.deployment.resources | toYaml | nindent 12 }}
          {{ end }}
        - name: nginx
          image: {{ .Values.deployment.containers.nginx.image }}
          imagePullPolicy: {{ .Values.deployment.containers.nginx.imagePullPolicy }}
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
          volumeMounts:
            - name: shared-files
              mountPath: /var/www/html
              readOnly: true
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            timeoutSeconds: 2
            periodSeconds: 3
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            timeoutSeconds: 2
            periodSeconds: 3
            initialDelaySeconds: 5
            failureThreshold: 3
      imagePullSecrets:
      {{- range .Values.deployment.imagePullSecrets }}
        - name: {{ .name }}
      {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "roundcube.fullname" . }}
        - name: shared-files
          emptyDir: {}
        {{- with .Values.deployment.additionalVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

      {{- with .Values.deployment.affinity }}
      affinity: {{- . | toYaml | nindent 8 }}
      {{- end }}
