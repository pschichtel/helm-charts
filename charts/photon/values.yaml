replicaCount: 1

image:
  registry: docker.io
  repository: rtuszik/photon-docker
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""
  digest: null

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - chart-example.local
  tls: []
    # - secretName: chart-example-tls
    #   hosts:
    #     - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# Additional volumes on the output Deployment definition.
volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

persistence:
  existingClaim: null
  pvc:
    accessModes:
      - ReadWriteMany
    resources:
      requests:
        # Numbers according to photon itself for the planet region:
        # Download size: 57.85 GB
        # Estimated extracted size: 94.29 GB
        # Temp space needed: 152.13 GB
        storage: 250Gi

photon:
  # temporary flag to bypass the entrypoint until it properly supports readOnlyRootFilesystem
  bypassEntrypoint: true
  updateStrategy: PARALLEL
  updateInterval: 720h
  region: planet
  languages:
    - en
  maxStartupSeconds: 3600

